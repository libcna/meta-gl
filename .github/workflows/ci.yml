name: CI

on:
  # web/ is the static website, deployed by pages.yml; editing it must not
  # rebuild and retest the library.
  push:
    paths-ignore: [ 'web/**' ]
  pull_request:
    paths-ignore: [ 'web/**' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC static
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            shared: "OFF"
          - name: Linux Clang shared
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            shared: "ON"
          - name: Windows MSVC shared
            os: windows-latest
            cc: ""
            cxx: ""
            shared: "ON"

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Mesa development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DMETAGL_BUILD_TESTS=ON
          -DMETAGL_BUILD_EXAMPLES=ON
          -DMETAGL_BUILD_GPU_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
          -DMETAGL_ENABLE_DEBUG_LOGGING=ON

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --config Debug --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2>&1 |
            Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Get-Content build.log |
              Select-String -Pattern 'error (C|LNK)[0-9]+|fatal error' |
              ForEach-Object {
                $message = $_.Line.Replace('%', '%25')
                Write-Output "::error::$message"
              }
            exit $buildExitCode
          }

      - name: Test compile surface
        timeout-minutes: 4
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -R '^metagl-compile-tests$'

      - name: Test mock loader and lifecycle
        timeout-minutes: 4
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -R '^metagl-mock-loader-test$'

      - name: Test API consistency
        timeout-minutes: 4
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -R '^metagl-api-consistency-test$'

      - name: Test installed package
        timeout-minutes: 4
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 180 -R '^metagl-installed-package-test$'

      - name: Test headless EGL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -R '^metagl-egl-smoke-test$'

  sanitizers:
    name: Linux Clang ASan and UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Mesa development packages
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DMETAGL_BUILD_TESTS=ON
          -DMETAGL_BUILD_EXAMPLES=ON
          -DMETAGL_BUILD_GPU_TESTS=ON
          -DMETAGL_SANITIZE=ON
          -DMETAGL_ENABLE_DEBUG_LOGGING=ON
          -DMETAGL_DEBUG_IMMEDIATE=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-sanitize --output-on-failure
